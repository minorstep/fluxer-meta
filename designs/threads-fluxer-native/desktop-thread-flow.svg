<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Fluxer desktop threads design flow</title>
  <desc id="desc">Desktop threads proposal showing message actions, create modal, sidebar preview and joined rows, thread list dropdown and admin handling.</desc>
  <defs>
    <style>
      .bg { fill: #111318; }
      .rail { fill: #151820; }
      .sidebar { fill: #191c23; }
      .canvas { fill: #1d2027; }
      .panel { fill: #242832; }
      .panel2 { fill: #2b303b; }
      .selected { fill: #343945; }
      .hover { fill: #2a2f39; }
      .floating { fill: #0d0f14; }
      .line { stroke: #3c4351; stroke-width: 1; }
      .softline { stroke: #313641; stroke-width: 1; }
      .accent { stroke: #8b5cf6; stroke-width: 2; }
      .accentFill { fill: #8b5cf6; }
      .blue { fill: #60a5fa; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #ef4444; }
      .text { fill: #eef1f7; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9aa3b4; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dim { fill: #6f7888; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .h { font-size: 22px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text x="48" y="58" class="text h">Threads, Fluxer-native desktop flow</text>
  <text x="48" y="86" class="muted small">Uses existing dark surfaces, channel-row density, message action strip and accent-only thread affordances.</text>

  <g transform="translate(48 122)">
    <rect class="rail" x="0" y="0" width="54" height="760" rx="0"/>
    <circle class="panel2" cx="27" cy="33" r="22"/>
    <path d="M15 34 C22 22 32 45 40 31" fill="none" stroke="#f4f7fb" stroke-width="4" stroke-linecap="round"/>
    <circle class="selected" cx="27" cy="92" r="22"/>
    <text x="19" y="99" class="text body">R</text>
    <circle class="panel2" cx="27" cy="151" r="22"/>
    <text x="20" y="158" class="muted body">A</text>
    <circle class="panel2" cx="27" cy="210" r="22"/>
    <text x="19" y="217" class="muted body">W</text>
  </g>

  <g transform="translate(102 122)">
    <rect class="sidebar" x="0" y="0" width="252" height="760"/>
    <text x="18" y="34" class="text body" font-weight="700">Robotics Club</text>
    <text x="18" y="84" class="muted tiny" font-weight="700">TEXT CHANNELS</text>
    <rect class="selected" x="12" y="98" width="226" height="36" rx="5"/>
    <text x="22" y="122" class="text body"># general</text>
    <text x="22" y="166" class="muted body"># news-updates</text>
    <text x="22" y="208" class="muted body"># memes</text>

    <g transform="translate(22 242)">
      <path d="M0 0 V82" class="accent" opacity=".75"/>
      <rect class="hover" x="12" y="-13" width="202" height="36" rx="5"/>
      <text x="28" y="10" class="text small">thread design pass</text>
      <text x="159" y="10" class="muted tiny">Joined</text>
      <text x="28" y="50" class="muted small">launch copy audit</text>
      <text x="155" y="50" class="dim tiny">Preview</text>
    </g>

    <text x="18" y="392" class="muted tiny" font-weight="700">VOICE CHANNELS</text>
    <text x="22" y="436" class="muted body">voice Robo Lounge</text>
    <text x="22" y="478" class="muted body">voice Gaming #1</text>

    <rect class="rail" x="0" y="704" width="252" height="56"/>
    <circle class="accentFill" cx="30" cy="732" r="16"/>
    <text x="54" y="727" class="text tiny" font-weight="700">Elliot</text>
    <text x="54" y="746" class="muted tiny">Online</text>
  </g>

  <g transform="translate(354 122)">
    <rect class="canvas" x="0" y="0" width="922" height="760"/>
    <rect class="canvas" x="0" y="0" width="922" height="54"/>
    <line class="softline" x1="0" y1="54" x2="922" y2="54"/>
    <text x="22" y="35" class="text h"># general</text>
    <g transform="translate(694 10)">
      <text x="0" y="27" class="muted body">star</text>
      <text x="52" y="27" class="muted body">pin</text>
      <rect class="selected" x="98" y="2" width="76" height="34" rx="5"/>
      <text x="112" y="26" class="text body">thread</text>
      <text x="192" y="27" class="muted body">fav</text>
    </g>

    <g transform="translate(42 94)">
      <circle class="accentFill" cx="21" cy="21" r="21"/>
      <path d="M11 22 C18 10 28 34 35 19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="58" y="15" class="text body" font-weight="700">Elliot</text>
      <text x="112" y="15" class="muted tiny">Today at 8:55 PM</text>
      <text x="58" y="44" class="text body">The model warnings are useful, but the logs are scattered across three panels.</text>

      <g transform="translate(500 -18)">
        <rect class="floating" width="240" height="40" rx="8"/>
        <text x="16" y="26" class="text small">react</text>
        <text x="70" y="26" class="text small">reply</text>
        <rect class="panel2" x="118" y="6" width="62" height="28" rx="5"/>
        <text x="130" y="26" class="text small">thread</text>
        <text x="190" y="26" class="muted small">forward</text>
      </g>

      <g transform="translate(58 72)">
        <path d="M0 0 C0 22 13 24 30 24" fill="none" stroke="#8b5cf6" stroke-width="2"/>
        <rect x="30" y="0" width="590" height="88" rx="6" fill="#20242d" stroke="#8b5cf6" stroke-width="1.4"/>
        <text x="50" y="30" class="text body" font-weight="700">thread design pass</text>
        <text x="492" y="30" class="muted tiny">3 min ago</text>
        <circle class="blue" cx="54" cy="58" r="12"/>
        <text x="74" y="63" class="muted small">Darlene: Move this into a thread before we lose the context.</text>
      </g>
    </g>

    <g transform="translate(112 314)">
      <rect class="floating" x="0" y="0" width="456" height="316" rx="8"/>
      <text x="24" y="38" class="text h">Start new thread</text>
      <text x="24" y="68" class="muted small">Creates a sub-channel under #general.</text>
      <text x="24" y="110" class="muted tiny" font-weight="700">THREAD NAME</text>
      <rect class="panel" x="24" y="122" width="408" height="42" rx="5"/>
      <text x="40" y="149" class="text small">thread design pass</text>
      <text x="24" y="194" class="muted tiny" font-weight="700">HOW LONG SHOULD IT REMAIN OPEN?</text>
      <rect class="panel" x="24" y="206" width="126" height="42" rx="5"/>
      <text x="76" y="233" class="text small">7</text>
      <rect class="panel" x="162" y="206" width="150" height="42" rx="5"/>
      <text x="205" y="233" class="text small">days</text>
      <text x="324" y="233" class="muted small">two controls</text>
      <rect class="panel" x="24" y="266" width="252" height="34" rx="5"/>
      <text x="84" y="288" class="muted small">Cancel</text>
      <rect class="accentFill" x="288" y="266" width="144" height="34" rx="5"/>
      <text x="320" y="288" class="text small">Create thread</text>
    </g>

    <g transform="translate(648 124)">
      <rect class="floating" width="236" height="316" rx="8"/>
      <text x="18" y="34" class="text body" font-weight="700">Threads in #general</text>
      <line class="line" x1="18" y1="52" x2="218" y2="52"/>
      <rect class="hover" x="14" y="72" width="208" height="58" rx="6"/>
      <text x="28" y="96" class="text small" font-weight="700">thread design pass</text>
      <text x="28" y="116" class="muted tiny">Following - mute from row menu</text>
      <rect class="panel" x="14" y="144" width="208" height="58" rx="6"/>
      <text x="28" y="168" class="text small" font-weight="700">qa notes</text>
      <text x="28" y="188" class="muted tiny">Closed, 1h ago</text>
      <rect class="panel" x="14" y="216" width="208" height="58" rx="6"/>
      <text x="28" y="240" class="muted small" font-weight="700">old launch room</text>
      <text x="28" y="260" class="dim tiny">Archived, 3d ago</text>
    </g>

    <g transform="translate(40 668)">
      <rect class="panel" x="0" y="0" width="842" height="58" rx="6"/>
      <text x="18" y="35" class="muted body">+ Message #general</text>
      <text x="674" y="35" class="muted small">GIF</text>
      <text x="724" y="35" class="muted small">emoji</text>
      <text x="790" y="35" class="muted small">send</text>
    </g>
  </g>

  <g transform="translate(1276 122)">
    <rect class="sidebar" x="0" y="0" width="276" height="760"/>
    <text x="24" y="38" class="text body" font-weight="700">Admin and rollout</text>
    <g transform="translate(22 74)">
      <rect class="panel" width="232" height="118" rx="6"/>
      <text x="16" y="28" class="text small" font-weight="700">Rollout prompt</text>
      <text x="16" y="54" class="muted small">Enable threads for your members!</text>
      <text x="16" y="82" class="dim tiny">Clears when clicked or when</text>
      <text x="16" y="100" class="dim tiny">community name is opened.</text>
    </g>
    <g transform="translate(22 222)">
      <rect class="panel" width="232" height="176" rx="6"/>
      <text x="16" y="28" class="text small" font-weight="700">Message Tools</text>
      <rect class="panel2" x="16" y="48" width="200" height="34" rx="5"/>
      <text x="28" y="70" class="muted tiny mono">ChannelID or ThreadID</text>
      <text x="16" y="106" class="text small">Browse Thread</text>
      <text x="16" y="132" class="muted tiny">Channel / Thread / User / Community</text>
      <text x="16" y="154" class="dim tiny">Each name links to the right admin page.</text>
    </g>
    <g transform="translate(22 428)">
      <rect class="panel" width="232" height="184" rx="6"/>
      <text x="16" y="28" class="text small" font-weight="700">Communities page</text>
      <text x="16" y="58" class="muted tiny">CATEGORYNAME (ID)</text>
      <rect class="selected" x="16" y="76" width="200" height="34" rx="4"/>
      <text x="28" y="98" class="text tiny"># general</text>
      <rect class="hover" x="36" y="116" width="180" height="24" rx="4"/>
      <text x="46" y="133" class="text tiny">thread-name - thread-id</text>
      <text x="170" y="133" class="dim tiny">Thread</text>
      <text x="16" y="164" class="dim tiny">Thread row is half-height and indented.</text>
    </g>
  </g>
</svg>
